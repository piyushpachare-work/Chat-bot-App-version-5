name: CI - Python & Mobile

on:
  push:
    branches: [ integration/v4-master, release/*, main ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run backend tests
        run: |
          if [ -d backend ] && [ -f backend/requirements.txt ]; then cd backend && pytest -q; fi

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile deps
        run: |
          if [ -f mobile/package.json ]; then cd mobile && npm ci; fi
      - name: Run mobile tests
        run: |
          if [ -f mobile/package.json ]; then cd mobile && npm test --silent; fi
